[project]
name = "ai-expense-telegram-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "supabase",
  "python-jose[cryptography]",
  "google-genai",
  "pytest",
  "pytest-asyncio",
  "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.fastapi]
entrypoint = "app.main:app"